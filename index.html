<!DOCTYPE html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08202f">
<meta name="description" content="Comoara Piratului — o poveste interactivă la masa de hărți a căpitanului.">
<title>Comoara Piratului</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Nunito:wght@400;600;700;800&family=Cutive+Mono&display=swap">
<style>
/* ═══ Comoara Piratului · masa de hărți a căpitanului ═══
   Layout pe înălțimea ecranului: pagina nu derulează niciodată.
   Panoul are trei zone — antet, conținut, punte de comandă. ═══ */
:root{
  color-scheme: dark;
  --abis:#08202f; --adanc:#10394f; --val:#1b5570;
  --pergament:#f0e2c0; --pergament-2:#e5d3aa; --umbra:#c2a87b;
  --cerneala:#33200f; --cerneala-2:#71512f;
  --alama:#dfa235; --alama-2:#a06f16;
  --fanion:#b53f2c; --alge:#2f7f5f;
  --spuma:#e9f2f2; --spuma-2:#9fb9c4;
  --r:14px;
  --gx:clamp(12px,2.2vw,24px);
  --gy:clamp(8px,1.5vh,16px);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --corp:"Nunito","Segoe UI",system-ui,sans-serif;
  --log:"Cutive Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background:var(--abis); color:var(--spuma);
  font-family:var(--corp);
  font-size:clamp(14px,1.55vh,17px); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#mare{position:fixed;inset:0;z-index:0;display:block}
#app{
  position:relative;z-index:1;
  height:100vh; height:100dvh;
  max-width:960px;margin:0 auto;
  padding:clamp(6px,1.2vh,14px) clamp(8px,2vw,18px);
  display:flex;flex-direction:column;gap:clamp(6px,1.1vh,12px);
}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:900;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--alama);outline-offset:2px;border-radius:6px}

/* ——— balustrada corăbiei ——— */
.rail{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:5px 7px;border-radius:999px;
  background:linear-gradient(180deg,#3a2a17,#241708);
  border:1px solid #543c1c;
  box-shadow:0 2px 0 #0004,inset 0 1px 0 #ffffff1a;
}
.medalion{
  width:clamp(28px,4vh,36px);height:clamp(28px,4vh,36px);flex:none;
  display:grid;place-items:center;font-size:clamp(15px,2.2vh,19px);
  border-radius:50%;background:radial-gradient(circle at 30% 25%,#f6cf7a,var(--alama-2));
  box-shadow:inset 0 0 0 2px #2e1e0a;
}
.nume{font-family:var(--display);font-weight:700;font-size:.94rem;color:#f4dfae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.rail .spatiu{flex:1}
.contor{
  display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  background:#00000038;border:1px solid #6b4e22;color:#f2d79a;
  font-family:var(--log);font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.mic-btn{
  flex:none;min-width:34px;padding:5px 10px;border-radius:999px;
  background:#00000038;border:1px solid #6b4e22;color:#f2d79a;font-weight:700;font-size:.84rem;
  white-space:nowrap;transition:background .15s;
}
.mic-btn:hover{background:#00000060}
.mic-btn.pornit{background:#dfa23533;border-color:var(--alama)}
@media (max-width:640px){ .mic-btn .cuv{display:none} }

/* ——— foaia de pergament: trei zone ——— */
.foaie{
  flex:1;min-height:0;position:relative;border-radius:var(--r);
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 90% at 12% 0%,#fbf0d5 0%,rgba(251,240,213,0) 55%),
    radial-gradient(90% 70% at 96% 100%,#d9c194 0%,rgba(217,193,148,0) 60%),
    var(--pergament);
  color:var(--cerneala);
  border:1px solid var(--umbra);
  box-shadow:0 18px 40px -18px #000b;
}
.foaie::after{content:"";position:absolute;inset:6px;border:1px dashed #b79a6c88;border-radius:calc(var(--r) - 5px);pointer-events:none;z-index:2}
.cap{flex:none;padding:var(--gy) var(--gx) 0;position:relative;z-index:1}
.corp{
  flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
  padding:var(--gy) var(--gx);
  display:flex;flex-direction:column;gap:clamp(7px,1.3vh,14px);
  position:relative;z-index:1;
  scrollbar-width:thin;scrollbar-color:#c2a87b transparent;
}
.corp::-webkit-scrollbar{width:8px}
.corp::-webkit-scrollbar-thumb{background:#c2a87b;border-radius:99px}
.corp.plin{padding:0 10px 6px;overflow:hidden}
.pod{
  flex:none;padding:clamp(7px,1.2vh,12px) var(--gx);
  border-top:1px dashed #b79a6c99;
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  position:relative;z-index:1;
}
.eticheta{font-family:var(--log);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cerneala-2)}
.titlu{font-size:clamp(1.25rem,3.4vh,2rem);line-height:1.1;margin:1px 0 0}
.subtitlu{font-family:var(--corp);font-weight:600;color:var(--cerneala-2);margin-top:4px}
.sus{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
hr.val{border:0;height:7px;margin:8px 0 0;opacity:.45;
  background:repeating-linear-gradient(90deg,transparent 0 6px,#8a6b3f 6px 7px)}

/* ——— personajul care vorbește ——— */
.vorbitor{display:flex;gap:10px;align-items:flex-start}
.chip{
  width:clamp(34px,5.4vh,50px);height:clamp(34px,5.4vh,50px);flex:none;
  display:grid;place-items:center;font-size:clamp(18px,3vh,26px);border-radius:11px;
  background:linear-gradient(160deg,#fff6e0,#dfc99a);border:1px solid var(--umbra);
  box-shadow:0 3px 0 #b99a6b;
}
.bula{flex:1;min-width:0}
.bula .cine{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--alama-2)}
.bula p + p{margin-top:7px}
.intrebare{font-family:var(--display);font-weight:700;font-size:clamp(1rem,2.5vh,1.32rem);line-height:1.25;text-wrap:balance;margin-top:1px}

/* ——— opțiuni ——— */
.optiuni{display:grid;gap:8px}
.opt{
  display:flex;gap:10px;align-items:center;text-align:left;width:100%;
  padding:clamp(8px,1.4vh,13px) 14px;border-radius:10px;
  background:#fffaf0;border:2px solid var(--umbra);color:var(--cerneala);
  font-weight:600;line-height:1.3;
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;
  box-shadow:0 3px 0 #c9b184;
}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--alama-2);box-shadow:0 5px 0 #c9b184}
.opt:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #c9b184}
.opt:disabled{cursor:default;opacity:.62}
.opt .litera{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--pergament-2);font-family:var(--log);font-size:.86rem;color:var(--cerneala-2)}
.opt.bun{background:#e4f4ea;border-color:var(--alge);box-shadow:0 3px 0 #2f7f5f66;opacity:1}
.opt.bun .litera{background:var(--alge);color:#fff}
.opt.rau{background:#fae7e3;border-color:var(--fanion);box-shadow:0 3px 0 #b53f2c55}
.opt.rau .litera{background:var(--fanion);color:#fff}

/* ——— butoane ——— */
.buton{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:clamp(9px,1.5vh,13px) clamp(14px,2.4vw,24px);border-radius:10px;
  font-family:var(--display);font-weight:700;font-size:clamp(.92rem,1.9vh,1.02rem);
  background:linear-gradient(180deg,#f3ba52,var(--alama));color:#3a2409;
  border:1px solid var(--alama-2);box-shadow:0 4px 0 var(--alama-2);
  transition:transform .1s,box-shadow .1s;
}
.buton:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--alama-2)}
.buton:active{transform:translateY(3px);box-shadow:0 1px 0 var(--alama-2)}
.buton.linistit{background:#fffaf0;color:var(--cerneala);border-color:var(--umbra);box-shadow:0 4px 0 var(--umbra)}
.buton.linistit:active{box-shadow:0 1px 0 var(--umbra)}
.buton:disabled{opacity:.42;cursor:default;transform:none;box-shadow:0 4px 0 var(--alama-2)}
.actiuni{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ——— verdict ——— */
.verdict{
  display:flex;gap:10px;align-items:flex-start;padding:clamp(8px,1.4vh,13px) 14px;border-radius:10px;
  border-left:5px solid;animation:intra .28s ease-out;
}
.verdict .sm{font-size:19px;line-height:1.1}
.verdict b{display:block;font-family:var(--display)}
.verdict.da{background:#e4f4ea;border-color:var(--alge);color:#1d4d39}
.verdict.nu{background:#fbeae6;border-color:var(--fanion);color:#7c2718}
.verdict.info{background:#f6ecd6;border-color:var(--alama-2);color:#5b4218}
@keyframes intra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ——— grila de hartă ——— */
.zona-harta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.grila{display:grid;gap:4px;background:#dcc79b;padding:7px;border-radius:11px;border:1px solid var(--umbra)}
.grila .cap2{display:grid;place-items:center;font-family:var(--log);font-size:.74rem;color:var(--cerneala-2);min-width:18px}
.celula{
  width:clamp(30px,min(8vw,5.6vh),52px);aspect-ratio:1;display:grid;place-items:center;
  font-size:clamp(14px,3vh,21px);
  background:#f7edd6;border:1px solid #cbb489;border-radius:7px;transition:transform .1s,background .12s;
}
.celula:hover:not(:disabled){background:#fff;transform:scale(1.06)}
.celula.plecare{background:#f6dfae;box-shadow:inset 0 0 0 2px var(--alama)}
.celula.corect{background:#b8e3c8;box-shadow:inset 0 0 0 3px var(--alge)}
.celula.gresit{background:#f3c8bf;box-shadow:inset 0 0 0 3px var(--fanion)}
.roza{width:clamp(64px,11vh,104px);flex:none;text-align:center;font-family:var(--log);font-size:.68rem;color:var(--cerneala-2)}
.roza svg{width:100%;height:auto;display:block}

/* ——— cod ——— */
.afisaj{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.slot{
  min-width:clamp(30px,5vh,44px);height:clamp(38px,6vh,54px);padding:0 7px;
  display:grid;place-items:center;border-radius:8px;
  background:#2c1c0e;color:#f6d894;font-family:var(--log);font-size:clamp(1rem,2.6vh,1.45rem);
  border:1px solid #000;box-shadow:inset 0 3px 8px #0009;
}
.slot.gol{color:#7e653f}
.taste{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px;max-width:330px;margin:0 auto;width:100%}
.taste.late{max-width:500px}
.tasta{
  padding:clamp(7px,1.5vh,13px) 0;border-radius:9px;background:#fffaf0;border:2px solid var(--umbra);
  font-family:var(--log);font-size:clamp(.95rem,2.2vh,1.18rem);color:var(--cerneala);box-shadow:0 3px 0 var(--umbra);
}
.tasta:hover{background:#fff}
.tasta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--umbra)}
.cifru{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;padding:9px;border-radius:10px;background:#f7edd6;border:1px dashed var(--umbra)}
.cifru div{text-align:center;font-family:var(--log);font-size:.9rem}
.cifru b{display:block;font-size:clamp(1rem,2.4vh,1.3rem);color:var(--alama-2)}

/* ——— memorie / ordine ——— */
.memorie{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;max-width:400px;margin:0 auto;width:100%}
.tile{
  aspect-ratio:1;display:grid;place-items:center;font-size:clamp(20px,4.4vh,32px);border-radius:12px;
  background:#f7edd6;border:2px solid var(--umbra);box-shadow:0 3px 0 var(--umbra);
  transition:transform .12s,filter .12s,background .12s;
}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile.aprins{background:var(--alama);transform:scale(1.09);filter:brightness(1.12)}
.sir-ales{display:flex;gap:6px;justify-content:center;min-height:26px;font-size:clamp(17px,3.4vh,25px);letter-spacing:2px}

/* ——— peliculă ——— */
.film{
  flex:1;min-height:0;position:relative;border-radius:11px;overflow:hidden;
  background:#04121d;border:1px solid #2f6a86;box-shadow:0 14px 30px -18px #000c;
}
.film canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.film .bara-f{position:absolute;left:0;top:0;height:3px;width:0;background:var(--alama);box-shadow:0 0 8px #dfa235aa;z-index:3}
.film .sari{
  position:absolute;top:9px;right:9px;z-index:3;padding:5px 12px;border-radius:999px;
  background:#0a2434d9;border:1px solid #3d7a95;color:#dbeaf1;font-size:.8rem;font-weight:800;
}
.film .sari:hover{background:#0f3d55}
.subt{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:clamp(20px,5vh,40px) clamp(12px,2.4vw,20px) clamp(9px,1.6vh,16px);
  background:linear-gradient(180deg,rgba(4,18,29,0),rgba(4,18,29,.7) 42%,rgba(4,18,29,.93));
  pointer-events:none;
}
.subt .cine2{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--alama);margin-bottom:1px}
.subt p{color:#f4eddd;font-size:clamp(.9rem,2.1vh,1.1rem);line-height:1.35;text-shadow:0 2px 8px #000c;max-width:62ch}
.subt.multi{overflow:auto;max-height:82%}
.subt.multi p + .cine2{margin-top:6px}

/* ——— harta insulelor ——— */
.chart{
  flex:1;min-height:0;position:relative;border-radius:11px;overflow:hidden;
  background:radial-gradient(120% 100% at 30% 10%,#1a5a76,#0c2c3f 70%);border:1px solid #2f6a86;
}
.chart svg.ruta{position:absolute;inset:0;width:100%;height:100%}
.insula{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;width:clamp(70px,11vw,112px)}
.pin{
  width:clamp(34px,6.4vh,56px);height:clamp(34px,6.4vh,56px);display:grid;place-items:center;
  font-size:clamp(17px,3.4vh,28px);border-radius:50%;
  background:radial-gradient(circle at 32% 26%,#fdf1d4,#d9bd85);border:2px solid #8a6b3f;
  box-shadow:0 6px 14px #0007;transition:transform .15s;position:relative;
}
.insula:hover .pin{transform:scale(1.08)}
.insula .et{font-family:var(--log);font-size:clamp(.58rem,1.3vh,.72rem);color:#d9ecf2;background:#08202fcc;padding:1px 6px;border-radius:999px;white-space:nowrap;border:1px solid #2f6a86}
.insula.blocata{cursor:default}
.insula.blocata .pin{filter:grayscale(.75) brightness(.6);border-color:#4d5f68;box-shadow:none}
.insula.blocata .et{opacity:.55}
.insula.gata .pin{box-shadow:0 0 0 4px #2f7f5f,0 6px 14px #0007}
.insula.acum .pin{animation:puls 1.8s ease-in-out infinite;box-shadow:0 0 0 4px var(--alama),0 6px 18px #000}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bifa{position:absolute;top:-6px;right:-6px;font-size:15px;filter:drop-shadow(0 1px 2px #000)}
.corabie{position:absolute;font-size:clamp(16px,2.8vh,24px);transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;filter:drop-shadow(0 2px 3px #0009)}

/* ——— colecție / jurnal ——— */
.colectie{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.obiect{display:grid;justify-items:center;gap:3px;padding:9px 5px;border-radius:10px;text-align:center;background:#f7edd6;border:1px dashed var(--umbra);font-size:.73rem;font-weight:700;color:var(--cerneala-2);line-height:1.2}
.obiect .ic{font-size:25px}
.obiect.gol{opacity:.42}
.indicii{display:grid;gap:6px}
.indiciu{display:flex;gap:9px;align-items:center;padding:8px 11px;border-radius:9px;background:#f7edd6;border-left:5px solid var(--alama);font-family:var(--log);font-size:.9rem;color:var(--cerneala)}
.indiciu .nr{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--alama-2);color:#fff5dd;font-size:1rem}
.insigne{display:flex;gap:7px;flex-wrap:wrap}
.insigna{display:flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:#f6dfae;border:1px solid var(--alama-2);font-weight:800;font-size:.8rem;color:#5b4218}
.insigna.gol{background:#eadfc4;border-style:dashed;border-color:var(--umbra);color:#9a8763}

/* ——— fereastră ——— */
#voal:empty{display:none}
.voal{position:fixed;inset:0;z-index:20;background:#04141fe0;display:grid;place-items:center;padding:12px}
.voal .foaie{max-width:620px;width:100%;max-height:94vh;flex:none;height:min(94vh,760px)}
.inchide{position:absolute;top:8px;right:10px;z-index:3;width:32px;height:32px;border-radius:50%;background:#00000012;font-size:18px;line-height:1}
.inchide:hover{background:#00000026}

/* ——— diverse ——— */
.mica{font-size:.84rem;color:var(--cerneala-2)}
.tag{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border-radius:999px;background:#f6dfae;border:1px solid var(--umbra);font-family:var(--log);font-size:.74rem;color:var(--cerneala-2);white-space:nowrap}
.avatare{display:flex;gap:7px;flex-wrap:wrap}
.av{width:clamp(40px,6.4vh,54px);height:clamp(40px,6.4vh,54px);border-radius:12px;display:grid;place-items:center;font-size:clamp(20px,3.6vh,26px);background:#fffaf0;border:2px solid var(--umbra);box-shadow:0 3px 0 var(--umbra)}
.av:hover{transform:translateY(-2px)}
.av.ales{background:var(--alama);border-color:var(--alama-2);box-shadow:0 3px 0 var(--alama-2)}
input.text{width:100%;padding:10px 13px;border-radius:9px;border:2px solid var(--umbra);background:#fffaf0;color:var(--cerneala);font-family:var(--display);font-weight:700;font-size:1.02rem}
input.text:focus{outline:none;border-color:var(--alama-2)}
.nivele{display:grid;gap:8px}
.nivel{text-align:left;padding:clamp(8px,1.5vh,14px) 15px;border-radius:11px;background:#fffaf0;border:2px solid var(--umbra);box-shadow:0 3px 0 var(--umbra);display:flex;gap:11px;align-items:center}
.nivel.ales{background:#f6dfae;border-color:var(--alama-2);box-shadow:0 3px 0 var(--alama-2)}
.nivel b{font-family:var(--display);display:block;font-size:1.02rem}
.nivel .ic{font-size:clamp(20px,3.6vh,27px)}
.bara{height:8px;border-radius:999px;background:#00000022;overflow:hidden;border:1px solid var(--umbra)}
.bara i{display:block;height:100%;background:linear-gradient(90deg,var(--alama),#f0c96b);transition:width .5s}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat div{padding:9px;border-radius:9px;background:#f7edd6;border:1px solid var(--umbra);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:clamp(1.15rem,3vh,1.6rem);line-height:1.05;color:var(--alama-2);font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--cerneala-2)}
.conf{position:fixed;top:-14px;width:10px;height:14px;z-index:30;pointer-events:none;border-radius:2px}
@keyframes cade{to{transform:translateY(104vh) rotate(720deg);opacity:.15}}
.scut{animation:scutura .32s}
@keyframes scutura{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>

<canvas id="mare" aria-hidden="true"></canvas>
<main id="app"></main>
<div id="voal"></div>

<script src="audio/manifest.js"></script>
<script>

var COCO={n:'Coco, papagalul',e:'🦜'};

  for(var i=0;i<l.length;i++){ if(l[i]==null) continue; var c=curataText(l[i]); if(c) r.push(c); }
  return r;
}
function elementNar(){ if(!NAR){ NAR=new Audio(); NAR.preload='auto'; } return NAR; }
/* browserele cer un gest al utilizatorului înainte de prima redare:
   la primul clic/tastă pornim un sunet mut pe același element, ca să-l deblocăm */
function deschideNar(){
  if(NAR_DESCHIS) return;
  try{
    var a=elementNar(); if(!a.paused) return; /* se redă deja ceva: nu întrerupem */
    a.src=NAR_MUT; var p=a.play();
    if(p&&p.then) p.then(function(){ NAR_DESCHIS=true; }).catch(function(){}); else NAR_DESCHIS=true;
  }catch(e){}
}
/* încarcă din timp fișierele pasului curent, ca vocea să pornească fără pauză */
function preincarca(texte){
  var s=segmente(texte);
  for(var i=0;i<s.length;i++){
    var u=fisierAudio(s[i]); if(!u) continue;
    var gata=false; for(var j=0;j<NAR_PRE.length;j++) if(NAR_PRE[j].u===u){ gata=true; break; }
    if(gata) continue;
    try{ var a=new Audio(); a.preload='auto'; a.src=u; NAR_PRE.push({u:u,a:a}); }catch(e){}
  }
  while(NAR_PRE.length>24){ var v=NAR_PRE.shift(); try{ v.a.removeAttribute('src'); v.a.load(); }catch(e){} }
}
function redaFisier(u,gata,esuat){
  var a=elementNar(), g=NAR_GEN, inchis=false;
  function fin(f){ if(inchis||g!==NAR_GEN) return; inchis=true; a.onended=a.onerror=null; f(); }
  a.onended=function(){ fin(gata); };
  a.onerror=function(){ fin(esuat); };
  try{
    a.src=u; var p=a.play();
    if(p&&p.then) p.then(function(){ NAR_DESCHIS=true; }).catch(function(){ fin(esuat); });
  }catch(e){ fin(esuat); }
}
function incarcaVoci(){
  try{ VOCI=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; }catch(e){ VOCI=[]; }
  VOCE=null;
  if(!VOCI.length) return;
  if(S&&S.vociNume) for(var i=0;i<VOCI.length;i++) if(VOCI[i].name===S.vociNume){ VOCE=VOCI[i]; return; }
  var ro=VOCI.filter(function(v){ return /^ro/i.test(v.lang); });
  VOCE=ro[0]||null;
}
/* rezerva: sinteza browserului (doar pentru texte fără fișier audio) */
function redaSinteza(t,gata){
  var g=NAR_GEN;
  function fin(){ if(g!==NAR_GEN) return; gata(); }
  try{
    if(!window.speechSynthesis){ fin(); return; }
    var u=new SpeechSynthesisUtterance(t);
    if(VOCE){ u.voice=VOCE; u.lang=VOCE.lang; } else { u.lang='ro-RO'; }
    u.rate=.95; u.pitch=1; u.volume=1;
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
  }catch(e){ fin(); }
}
/* citește un text sau o listă de texte, unul după altul */
function spune(text,dupa){
  taci();
  if(!S||!S.voce) return;
  var s=segmente(text); if(!s.length) return;
  var g=NAR_GEN;
  (function urm(i){
    if(g!==NAR_GEN) return;
    if(i>=s.length){ if(dupa) dupa(); return; }
    var u=fisierAudio(s[i]), mai=function(){ urm(i+1); };
    if(u) redaFisier(u,mai,function(){ redaSinteza(s[i],mai); });
    else redaSinteza(s[i],mai);
  })(0);
}
function taci(){
  NAR_GEN++;
  try{ if(NAR){ NAR.onended=NAR.onerror=null; NAR.pause(); } }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
function comutaVoce(){ S.voce=!S.voce; if(!S.voce) taci(); sClic(); salveaza(); render(); }

/* ═══════════ FUNDAL: HARTĂ MARINĂ ═══════════ */
function deseneazaMarea(){
  var c=document.getElementById('mare'); if(!c) return;
  var w=c.width=innerWidth, h=c.height=innerHeight, x=c.getContext('2d');
  var g=x.createRadialGradient(w*.3,-h*.15,40,w*.3,h*.2,Math.max(w,h)*1.1);
  g.addColorStop(0,'#1a5a76'); g.addColorStop(.55,'#0d3348'); g.addColorStop(1,'#061a27');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(223,162,53,.07)'; x.lineWidth=1;
  for(var i=0;i<w;i+=68){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,h); x.stroke(); }
  for(var j=0;j<h;j+=68){ x.beginPath(); x.moveTo(0,j); x.lineTo(w,j); x.stroke(); }
  [[w*.18,h*.28,Math.min(w,h)*.9],[w*.86,h*.74,Math.min(w,h)*.8]].forEach(function(r){
    x.strokeStyle='rgba(223,162,53,.09)';
    for(var k=0;k<16;k++){
      var a=k*Math.PI/8;
      x.beginPath(); x.moveTo(r[0],r[1]);
      x.lineTo(r[0]+Math.cos(a)*r[2],r[1]+Math.sin(a)*r[2]); x.stroke();
    }
    x.beginPath(); x.arc(r[0],r[1],26,0,7); x.stroke();
    x.beginPath(); x.arc(r[0],r[1],52,0,7); x.stroke();
  });
  var v=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(2,12,20,.75)');
  x.fillStyle=v; x.fillRect(0,0,w,h);
}

function ceasSVG(h,m){
  var rad=Math.PI/180, ah=((h%12)+m/60)*30-90, am=m*6-90, ticks='', i, a;
  for(i=0;i<12;i++){
    a=(i*30-90)*rad;

      '" x2="'+(50+Math.cos(a)*43).toFixed(2)+'" y2="'+(50+Math.sin(a)*43).toFixed(2)+
      '" stroke="#8a6b3f" stroke-width="'+(i%3===0?3:1.5)+'"/>';
  }
  return '<svg viewBox="0 0 100 100" width="112" height="112" aria-hidden="true">'+
    '<circle cx="50" cy="50" r="45" fill="#f7edd6" stroke="#8a6b3f" stroke-width="3"/>'+ticks+
    '<line x1="50" y1="50" x2="'+(50+Math.cos(ah*rad)*24).toFixed(2)+'" y2="'+(50+Math.sin(ah*rad)*24).toFixed(2)+'" stroke="#33200f" stroke-width="5" stroke-linecap="round"/>'+
    '<line x1="50" y1="50" x2="'+(50+Math.cos(am*rad)*34).toFixed(2)+'" y2="'+(50+Math.sin(am*rad)*34).toFixed(2)+'" stroke="#b53f2c" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="50" cy="50" r="4" fill="#33200f"/></svg>';
}

    d.className='conf'; d.style.left=Math.random()*100+'vw'; d.style.background=cul[i%cul.length];
    d.style.animation='cade '+(1.9+Math.random()*1.4)+'s linear '+(Math.random()*.5)+'s forwards';

function ecranHarta(){
  var urm=0; while(urm<INSULE.length&&S.gata.indexOf(urm)>=0) urm++;
  if(urm>=INSULE.length) urm=INSULE.length-1;
  var pts=INSULE.map(function(I){ return I.x+','+I.y; }).join(' ');
  var pini=INSULE.map(function(I,k){
    var st=S.gata.indexOf(k)>=0?'gata':(deblocata(k)?(k===urm?'acum':''):'blocata');
    var poate=deblocata(k)&&S.gata.indexOf(k)<0;
    return '<'+(poate?'button':'div')+' class="insula '+st+'" style="left:'+I.x+'%;top:'+I.y+'%"'+
      (poate?' onclick="intraInsula('+k+')"':'')+' aria-label="'+E(I.nume)+'">'+
      '<div class="pin">'+(st==='blocata'?'🔒':I.e)+(st==='gata'?'<span class="bifa">✅</span>':'')+'</div>'+
      '<div class="et">'+(k+1)+'. '+E(I.nume)+'</div></'+(poate?'button':'div')+'>';
  }).join('');
  var pozC=INSULE[urm];
  var cap='<div class="sus"><div>'+
      '<div class="eticheta">Harta Mărilor Uitate</div>'+
      '<h2 class="titlu" style="font-size:clamp(1rem,2.6vh,1.45rem)">'+(S.gata.length>=INSULE.length?'Toate insulele explorate':'Escala următoare: '+E(INSULE[urm].nume))+'</h2>'+

    '<div class="bara" style="margin-top:7px"><i style="width:'+Math.round(S.gata.length/INSULE.length*100)+'%"></i></div>';
  var corp='<div class="chart">'+
      '<svg class="ruta" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
        '<polyline points="'+pts+'" fill="none" stroke="#dfa23577" stroke-width="0.6" stroke-dasharray="2 2"/>'+
      '</svg>'+pini+
      '<div class="corabie" style="left:'+pozC.x+'%;top:'+(pozC.y-13)+'%">⛵</div>'+
    '</div>';
  var pod=(S.gata.indexOf(INSULE.length-1)<0
      ?'<button class="buton" onclick="intraInsula('+urm+')">'+INSULE[urm].e+' Debarcă pe '+E(INSULE[urm].nume)+'</button>'
      :'<button class="buton" onclick="mergiLa(\'final\')">💎 Vezi diploma</button>')+

  return foaie(cap,corp,pod,'plin');
}

function mergiLa(e){ taci(); S.ecran=e; salveaza(); render(); }
function intraInsula(k){
  if(!deblocata(k)) return;
  S.ins=k; S.p=0; S.ecran='joc'; sClic(); intraPas(); salveaza(); render();
}
function intraPas(){
  GEN++; taci(); if(typeof opresteAmb==='function') opresteAmb();
  var p=R(pasCurent()||{t:'story',text:['']});
  if(p.t==='film'&&typeof paceazaFilm==='function') p=paceazaFilm(p);
  A={pas:p,gres:0,rezolvat:false,buf:[],faza:'',gen:GEN,fb:'',fbTip:'',aratHint:false,ales:-1};
  if(p.t==='alege') A.opt=amestecat(p.opt);
  if(p.t==='memorie'){ A.seq=[]; for(var i=0;i<p.lung;i++) A.seq.push(Math.floor(Math.random()*p.pool.length)); A.faza='arata'; aratSir(); }
  if(p.t==='ordine') A.ramase=p.items.slice();
  if(S.voce) preincarca(texteDin(p));
  if(p.t!=='film'&&p.q&&S.voce) setTimeout(function(){ if(A.pas===p) spune(p.q); },260);
}
function inainte(){
  S.p++;
  var c=coada(S.ins);
  if(S.p>=c.length){ terminaInsula(); return; }
  intraPas(); salveaza(); render();
}
function terminaInsula(){
  taci(); if(typeof opresteAmb==='function') opresteAmb();
  if(S.gata.indexOf(S.ins)<0) S.gata.push(S.ins);
  if(S.ins>=INSULE.length-1){ S.ecran='final'; sPremiu(); confetti(); }
  else S.ecran='chart';
  salveaza(); render();
}
function scor(cat,bun){ if(!cat||!S.st[cat]) return; S.st[cat].t++; if(bun) S.st[cat].ok++; }
/* mesaj = ce se afișează; voce = ce se citește, dacă diferă (ex. fără litera căsuței) */
function succes(mesaj,voce){
  A.rezolvat=true; A.fbTip='da';
  A.fb=mesaj||NAR_FIXE.ok; A.fbV=[voce||A.fb];
  scor(A.pas.cat,A.gres===0);
  if(A.gres===0) S.dub+=2;
  sOk(); spune(A.fbV); salveaza(); render();
}
function esec(mesaj,voce){
  A.gres++; A.fbTip='nu';
  A.fb=mesaj||NAR_FIXE.nu; A.fbV=[voce||A.fb];
  if(S.dub>0) S.dub--;
  if(A.gres>=2){ A.rezolvat=true; A.fbTip='info'; A.fb=(mesaj||'')+' '+NAR_FIXE.corect; A.fbV=[voce||mesaj,NAR_FIXE.corect]; scor(A.pas.cat,false); }
  else A.aratHint=true;
  sNu(); spune(A.aratHint&&A.pas.hint?A.fbV.concat([A.pas.hint]):A.fbV); salveaza(); render();
  var f=document.querySelector('.foaie'); if(f){ f.classList.add('scut'); setTimeout(function(){f.classList.remove('scut');},340); }
}
function cereIndiciu(){ A.aratHint=true; if(S.dub>0) S.dub--; sClic(); salveaza(); render(); spune(A.pas.hint); }
function citesteAcum(){
  var p=A.pas, t=[p.q];
  if(A.fb) t=t.concat(A.fbV||[A.fb]);
  if(A.aratHint&&p.hint&&!A.rezolvat) t.push(NAR_FIXE.indiciu,p.hint);
  spune(t);
}

function blocFeedback(){
  var p=A.pas,h='';
  if(A.fb) h+='<div class="verdict '+A.fbTip+'"><span class="sm">'+(A.fbTip==='da'?'🎉':(A.fbTip==='nu'?'🤔':'💡'))+'</span><div>'+

  x.beginPath(); x.moveTo(-300,VH+200); x.lineTo(-300,VH*.86);
  for(var i=-300;i<=VW+300;i+=30) x.lineTo(i,VH*.86+Math.sin(i*.008)*14);
  x.lineTo(VW+300,VH+200); x.closePath(); x.fill();
}
var SCENE={mare:scMare,plaja:scPlaja,pestera:scPestera,jungla:scJungla,recif:scRecif,vulcan:scVulcan,craniu:scCraniu,harta:scHarta,apus:scApus};

/* ——— actori ——— */
function deseneazaActori(x,p,t){
  (p.actori||[]).forEach(function(a){
    var t0=a.t0, t1=a.t1===undefined?a.t0+1:a.t1, pana=a.pana===undefined?p.dur:a.pana;
    if(t<t0||t>pana) return;
    var u=t1>t0?ease((t-t0)/(t1-t0)):1;
    var fx=(a.from?a.from[0]:a.to[0]), fy=(a.from?a.from[1]:a.to[1]);
    var px=lerp(fx,a.to[0],u)*VW;
    var py=lerp(fy,a.to[1],u)*VH-(a.arc||0)*Math.sin(Math.PI*u)*VH;
    if(u>=1&&a.bob!==false) py+=Math.sin(t*2.2)*5;
    var al=clamp((t-t0)/.4,0,1)*clamp((pana-t)/.5,0,1);
    var s=a.s||64, fn=a.p&&PERS[a.p];
    x.save(); x.globalAlpha=al;
    if(a.sol){
      x.fillStyle='rgba(0,0,0,.22)';
      x.beginPath(); x.ellipse(px,py+s*.5,s*.42,s*.1,0,0,7); x.fill();
    }
    x.translate(px,py);
    if(a.flip) x.scale(-1,1);
    if(u<1&&a.inclina) x.rotate(Math.sin(t*9)*.14);
    if(fn){ x.scale(s/100,s/100); fn(x,t,u<1); }
    else {
      x.font=s+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      x.textAlign='center'; x.textBaseline='middle';
      x.shadowColor='rgba(0,0,0,.5)'; x.shadowBlur=12; x.shadowOffsetY=4;
      x.fillText(a.e||'?',0,0);
    }
    x.restore();
  });
}
function cadruLa(p,t){
  var c=p.cadre, ac=0;
  for(var i=0;i<c.length;i++){ if(t<c[i].pana){ ac=i; break; } ac=i; }
  return {c:c[ac],start:ac===0?0:c[ac-1].pana,idx:ac};
}
function deseneazaFilm(cv,p,t){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.max(80,cv.clientWidth||640), h=Math.max(60,cv.clientHeight||360);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  }
  var x=cv.getContext('2d'), W=cv.width, H=cv.height;
  var k=Math.max(W/VW,H/VH);
  x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,W,H);
  x.setTransform(k,0,0,k,(W-VW*k)/2,(H-VH*k)/2);
  var cad=cadruLa(p,t);
  (SCENE[cad.c.scena]||scMare)(x,t,t-cad.start,cad.c.par||{});
  deseneazaActori(x,p,t);
  var tc=t-cad.start;
  if(tc<.5){ x.fillStyle='rgba(0,0,0,'+(1-tc/.5).toFixed(2)+')'; x.fillRect(-300,-200,VW+600,VH+400); }
  if(t>p.dur-.6){ x.fillStyle='rgba(0,0,0,'+clamp((t-(p.dur-.6))/.6,0,1).toFixed(2)+')'; x.fillRect(-300,-200,VW+600,VH+400); }
  var v=x.createRadialGradient(VW*.5,VH*.5,VH*.4,VW*.5,VH*.5,VW*.78);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.5)');
  x.fillStyle=v; x.fillRect(-300,-200,VW+600,VH+400);
  for(var gr=0;gr<22;gr++){
    x.fillStyle='rgba(255,255,255,'+(Math.random()*.028).toFixed(3)+')';
    x.fillRect(Math.random()*VW,Math.random()*VH,2,2);
  }
}
/* ——— ambianță ——— */
var AMBCFG={mare:[520,.045],plaja:[600,.035],pestera:[240,.03],jungla:[880,.028],recif:[420,.035],vulcan:[190,.045],craniu:[300,.03],harta:[0,0],apus:[430,.032]};
function ambianta(tip){
  opresteAmb();
  if(!S.sunet||!AMBCFG[tip]||!AMBCFG[tip][0]) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var len=Math.floor(AC.sampleRate*2), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*.6;
    var src=AC.createBufferSource(); src.buffer=b; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=AMBCFG[tip][0]; f.Q.value=.8;
    var g=AC.createGain(); g.gain.value=0;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
    g.gain.linearRampToValueAtTime(AMBCFG[tip][1],AC.currentTime+1.4);
    var lfo=AC.createOscillator(), lg=AC.createGain();
    lfo.frequency.value=.14; lg.gain.value=AMBCFG[tip][0]*.5;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    AMB={src:src,g:g,lfo:lfo};
  }catch(e){}
}
function opresteAmb(){
  if(!AMB) return;
  var a=AMB; AMB=null;
  try{ a.g.gain.linearRampToValueAtTime(.0001,AC.currentTime+.5);
    setTimeout(function(){ try{ a.src.stop(); a.lfo.stop(); }catch(e){} },700); }catch(e){}
}

/* ——— pacing: filmul se întinde cât are naratoarea de citit ——— */
function paceazaFilm(p){
  if(!S.voce||!p.replici||!p.replici.length) return p;
  var RATA=2.7, k;
  var vechi=p.replici.map(function(r){ return r.t; });
  var noi=[], t=vechi[0]||0;
  for(var i=0;i<p.replici.length;i++){
    noi.push(t);
    var d=durataAudio(p.replici[i].x);
    var nevoie=Math.max(1.2,(d||p.replici[i].x.split(/\s+/).length/RATA)+.45);
    var gol=(i+1<vechi.length)?vechi[i+1]-vechi[i]:(p.dur-vechi[i]);
    t+=Math.max(gol,nevoie);
  }
  var durNou=Math.max(p.dur,t+1.2);
  var xs=[0].concat(vechi,[p.dur]), ys=[0].concat(noi,[durNou]);
  function m(v){
    for(var j=0;j<xs.length-1;j++){
      if(v<=xs[j+1]){ var d=xs[j+1]-xs[j]; return d<=0?ys[j]:ys[j]+(ys[j+1]-ys[j])*((v-xs[j])/d); }
    }
    return ys[ys.length-1];
  }
  function r1(v){ return Math.round(v*10)/10; }
  var q={}; for(k in p) q[k]=p[k];
  q.dur=r1(durNou);
  q.replici=p.replici.map(function(r,i){ var c={},k2; for(k2 in r) c[k2]=r[k2]; c.t=r1(noi[i]); return c; });
  q.cadre=p.cadre.map(function(c,i){ var d={},k3; for(k3 in c) d[k3]=c[k3];
    d.pana=(i===p.cadre.length-1)?q.dur:r1(m(c.pana)); return d; });
  q.actori=(p.actori||[]).map(function(a){ var b={},k4; for(k4 in a) b[k4]=a[k4];
    b.t0=r1(m(a.t0));
    if(a.t1!==undefined) b.t1=r1(m(a.t1));
    if(a.pana!==undefined) b.pana=r1(m(a.pana));
    return b; });
  return q;
}

function pornesteFilm(){
  var p=A.pas; if(!p||p.t!=='film') return;
  if(!document.getElementById('peliculaC')) return;
  if(A.t0===undefined) A.t0=performance.now();

function subtitrare(t){

function terminaFilm(totul){

}
